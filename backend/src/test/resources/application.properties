spring.application.name=SmartTrip Backend Test

# In-memory H2 database for isolated testing (MySQL mode, NON_KEYWORDS=USER)
spring.datasource.url=jdbc:h2:mem:smarttriptest;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Test AI configuration
groq.api.key=test-groq-key
groq.model=llama-3.3-70b-versatile
gemini.api.key=test-gemini-key
gemini.model=gemini-2.5-flash
