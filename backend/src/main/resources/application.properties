spring.application.name=SmartTrip Backend

# ===============================
# MySQL Database
# ===============================

# MySQL Database (Supports Railway environment variables with local defaults)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:smarttrip}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:Cherry1006}

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Server
# ===============================

server.port=8080

# ===============================
# Google Gemini AI
# ===============================

gemini.api.key=${GEMINI_API_KEY:}

# ===============================
# Groq AI
# ===============================

groq.api.key=${GROQ_API_KEY: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}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}