spring.application.name=SmartTrip Backend
spring.config.import=optional:classpath:application-local.properties

# ===============================
# MySQL Database
# ===============================

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:smarttrip}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:Cherry1006}

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Server
# ===============================

server.port=8080

# ===============================
# Google Gemini AI
# ===============================

gemini.api.key=${GEMINI_API_KEY:}

# ===============================
# Groq AI
# ===============================

groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}